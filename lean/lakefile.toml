# Lean 4 proof of the time separation theorem (release build).
# Toolchain, Mathlib and lake-manifest.json are exactly those of the audited build.
# OAI/ and Lemmata/ are NOT in this repository: scripts/get-upstream.sh fetches them at the audited commits,
# applies the patches and checks every file against CLOSURE-SHA256SUMS.
# The package name "p1" is kept so that lake-manifest.json stays byte-identical to the audited one.
name = "p1"
defaultTargets = ["Release"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# Release.lean: imports the four closed theorems and prints their axioms.
[[lean_lib]]
name = "Release"

# Third-party sources, fetched by scripts/get-upstream.sh (openai/math@3344da5, ZIB-IOL/lemmata@a2dd430).
[[lean_lib]]
name = "OAI"

[[lean_lib]]
name = "Lemmata"

# The Mathlib-only statement files.
[[lean_lib]]
name = "C1Challenge"

# The proof.
[[lean_lib]]
name = "P1Batch"

[[lean_lib]]
name = "P1Benes"

[[lean_lib]]
name = "P1C10"

[[lean_lib]]
name = "P1C1U"

[[lean_lib]]
name = "P1Case1"

[[lean_lib]]
name = "P1ChkDir"

